name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      # Only Chromium is installed in CI - it's what the "login" and
      # "authenticated" projects use, plus the "api" project needs no
      # browser at all. Firefox is configured in playwright.config.ts and
      # verified locally, but isn't installed here to keep every push/PR
      # run fast. Run `npx playwright test --project=firefox` locally (with
      # `npx playwright install firefox` first) for the cross-browser check.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --project=setup --project=login --project=authenticated --project=api

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
