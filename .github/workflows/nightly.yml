name: Nightly

# Runs both suites against the live demo sites every night and publishes the
# HTML reports to GitHub Pages, so the README badge and the report link always
# reflect a real, recent run. Suites run in parallel; the publish job waits for
# both and publishes whatever they produced, pass or fail, because a red report
# is more useful on the site than a stale green one.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC, 23:00 Pacific the evening before

permissions:
  contents: write

concurrency:
  group: nightly-pages
  cancel-in-progress: false

jobs:
  selenium:
    name: Selenium + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: selenium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: selenium/requirements.txt
      - run: pip install -r requirements.txt
      - uses: browser-actions/setup-chrome@v1
      - name: Run pytest (headless)
        id: pytest
        run: |
          pytest --reruns 1 --reruns-delay 5 \
            --html=report.html --self-contained-html \
            -v --tb=short -p no:warnings
        env:
          HEADLESS: "true"
          SELENIUM_TIMEOUT: "45"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-report
          path: selenium/report.html
          retention-days: 30

  playwright:
    name: Playwright + TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: playwright/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test --project=setup --project=login --project=authenticated --project=api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright/playwright-report/
          retention-days: 30

  publish:
    name: Publish reports to gh-pages
    needs: [selenium, playwright]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: selenium-report
          path: site/selenium
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: site/playwright
        continue-on-error: true
      - name: Build index page
        env:
          SELENIUM_RESULT: ${{ needs.selenium.result }}
          PLAYWRIGHT_RESULT: ${{ needs.playwright.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/build-report-index.sh site
      # Publishes by pushing the built site to the gh-pages branch. This only
      # needs contents:write, which the workflow token has, so it does not
      # depend on the Pages API being able to create a site. GitHub serves the
      # branch at https://oscar-leung.github.io/qa-portfolio/ once the Pages
      # source is "Deploy from a branch: gh-pages / (root)".
      - name: Push site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
          commit_message: "Nightly reports from run ${{ github.run_id }}"
      - name: Where to look
        run: |
          echo "::notice title=Reports pushed to gh-pages::If https://oscar-leung.github.io/qa-portfolio/ is not live within a few minutes, open Settings -> Pages and set Source to 'Deploy from a branch', branch gh-pages, folder / (root), then Save."
